; PlatformIO — firmware ESP32 del Monocóptero
; Uso (desde esta carpeta):
;   pio run -t upload       compila y sube el firmware
;   pio run -t uploadfs     sube la interfaz web (carpeta data/) a LittleFS
;   pio device monitor      monitor serie a 115200

[platformio]
src_dir  = monocoptero_esp32
data_dir = data

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino
lib_deps =
  ESP32Async/ESPAsyncWebServer @ ^3.7.0
  ESP32Async/AsyncTCP          @ ^3.3.0
  bblanchon/ArduinoJson        @ ^7.0.0
  madhephaestus/ESP32Servo     @ ^3.0.6
board_build.filesystem = littlefs
monitor_speed = 115200
; upload_port = COM3
